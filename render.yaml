services:
  - type: web
    name: fetchuccini
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn -c gunicorn.conf.py config.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FETCHUCCINI_CACHE_DIR
        value: /tmp/fetchuccini-cache
