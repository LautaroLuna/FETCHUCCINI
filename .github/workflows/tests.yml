name: Fetchuccini tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q searchapp config scripts
      - run: python manage.py check
      - run: python manage.py test searchapp.tests -v 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check searchapp/static/searchapp/app.js
